<style>
#workspace-proposal { --sa-bg:light-dark(#fafafa,#1c2027);--sa-surface:light-dark(#ffffff,#232832);--sa-ink:light-dark(#252a34,#e6eaf0);--sa-muted:light-dark(#737d8c,#abb5c3);--sa-line:light-dark(#e9ecf1,#353d49);--sa-hover:light-dark(#ebf4ff66,#303b4c);--sa-selected:light-dark(#e8f0f8,#303e55);--sa-blue:light-dark(#4c6696,#abc3ec);--sa-field:light-dark(#f2f4f7,#2d3440);color:var(--sa-ink);font-family:SAProposalSatoshi,SAProposalMiSans,MiSans,"Microsoft YaHei UI",sans-serif;font-size:14px;line-height:1.65;color-scheme:light dark;min-width:0; }
#workspace-proposal * { box-sizing:border-box; }
#workspace-proposal button,#workspace-proposal input,#workspace-proposal select,#workspace-proposal textarea { font:inherit;color:inherit; }
#workspace-proposal button { border:0;background:transparent;text-align:left; }
#workspace-proposal button:focus-visible,#workspace-proposal select:focus-visible,#workspace-proposal textarea:focus-visible,#workspace-proposal input:focus-visible { outline:2px solid var(--sa-blue);outline-offset:3px; }
#workspace-proposal [hidden] { display:none!important; }
#workspace-proposal .sa-preview-line { display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:0 96px 14px 0;color:var(--sa-muted);font-size:12px; }
#workspace-proposal .sa-preview-line label { display:flex;align-items:center;gap:8px; }
#workspace-proposal select { max-width:100%;border:1px solid var(--sa-line);border-radius:7px;background:var(--sa-surface);padding:5px 9px; }
#workspace-proposal .sa-product { position:relative;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:804px;background:var(--sa-bg);isolation:isolate; }
#workspace-proposal .sa-sidebar { display:flex;flex-direction:column;background:var(--sa-surface);min-width:0;padding:12px 12px 10px;z-index:5; }
#workspace-proposal .sa-brand-line { display:flex;align-items:center;gap:10px;padding:0 2px 10px;min-height:38px; }
#workspace-proposal .sa-brand { display:flex;align-items:center;gap:7px;min-width:0;color:var(--sa-ink);font-weight:600;font-size:16px; }
#workspace-proposal .sa-brand svg { width:23px;height:23px;stroke-width:1.5; }
#workspace-proposal .sa-collapse { margin-left:auto;padding:5px;color:var(--sa-muted);display:flex;align-items:center;justify-content:center; }
#workspace-proposal .sa-group { margin:10px 0 0; }
#workspace-proposal .sa-group-title { color:var(--sa-muted);font-size:11px;font-weight:400;padding:0 12px 5px;margin:0; }
#workspace-proposal .sa-nav { display:flex;align-items:center;gap:14px;width:100%;min-height:33px;border-radius:8px;padding:6px 12px;font-size:13px;line-height:1.5;margin:1px 0;white-space:nowrap; }
#workspace-proposal .sa-nav svg { width:20px;height:20px;flex:none;stroke-width:1.5;color:var(--sa-muted); }
#workspace-proposal .sa-nav:hover { background:var(--sa-hover); }
#workspace-proposal .sa-nav[aria-current="page"] { background:var(--sa-selected);color:var(--sa-blue); }
#workspace-proposal .sa-nav[aria-current="page"] svg { color:var(--sa-blue); }
#workspace-proposal .sa-new { font-size:10px;color:var(--sa-blue);margin-left:auto;letter-spacing:.03em; }
#workspace-proposal .sa-recent { margin:25px 12px 20px; }
#workspace-proposal .sa-recent summary { color:var(--sa-muted);font-size:12px; }
#workspace-proposal .sa-recent button { padding:9px 0 0;font-size:12px;line-height:1.65; }
#workspace-proposal .sa-recent small { display:block;color:var(--sa-muted); }
#workspace-proposal .sa-bottom { margin-top:auto;border-top:1px solid var(--sa-line);padding-top:10px; }
#workspace-proposal .sa-person { margin:8px 12px 0;color:var(--sa-muted);font-size:11px; }
#workspace-proposal .sa-stage { min-width:0; }
#workspace-proposal .sa-topbar { display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:58px;padding:10px 26px;color:var(--sa-muted);font-size:12px; }
#workspace-proposal .sa-path { margin-right:auto; }
#workspace-proposal .sa-topbar select { border:0;background:var(--sa-field);font-size:12px;max-width:180px; }
#workspace-proposal .sa-person-label { color:var(--sa-ink); }
#workspace-proposal .sa-main { padding:30px 34px 48px;min-width:0; }
#workspace-proposal h1 { font-size:25px;line-height:1.4;font-weight:500;margin:0 0 9px;letter-spacing:-.025em; }
#workspace-proposal h2 { font-size:17px;font-weight:500;line-height:1.5;margin:0 0 10px; }
#workspace-proposal h3 { font-size:14px;font-weight:500;margin:0 0 5px; }
#workspace-proposal p { margin:0 0 14px; }
#workspace-proposal .sa-description { color:var(--sa-muted);font-size:13px;max-width:54em; }
#workspace-proposal .sa-muted { color:var(--sa-muted); }
#workspace-proposal .sa-section { margin-top:26px; }
#workspace-proposal .sa-tabs { display:flex;flex-wrap:wrap;gap:20px;border-bottom:1px solid var(--sa-line);margin:22px 0 24px; }
#workspace-proposal .sa-tab { color:var(--sa-muted);padding:0 0 10px;position:relative;font-size:13px; }
#workspace-proposal .sa-tab[aria-selected="true"] { color:var(--sa-ink); }
#workspace-proposal .sa-tab[aria-selected="true"]:after { content:"";height:2px;position:absolute;left:0;right:0;bottom:-1px;background:var(--sa-blue); }
#workspace-proposal .sa-button { padding:7px 12px;border:1px solid var(--sa-line);border-radius:8px;background:var(--sa-surface);font-size:12px;white-space:nowrap; }
#workspace-proposal .sa-button:hover { background:var(--sa-hover); }
#workspace-proposal .sa-button-primary { color:var(--sa-blue);background:var(--sa-selected);border-color:var(--sa-selected); }
#workspace-proposal .sa-text-button { color:var(--sa-blue);font-size:12px;padding:3px 0; }
#workspace-proposal .sa-row { display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--sa-line);padding:17px 0; }
#workspace-proposal .sa-row-content { min-width:0;flex:1; }
#workspace-proposal .sa-row-content p { color:var(--sa-muted);font-size:12px;margin:3px 0 0; }
#workspace-proposal .sa-row-icon { display:flex;align-items:center;justify-content:center;color:var(--sa-muted);width:26px;flex:none; }
#workspace-proposal .sa-row-icon svg { width:21px;height:21px;stroke-width:1.5; }
#workspace-proposal .sa-status { color:var(--sa-muted);font-size:11px;white-space:nowrap; }
#workspace-proposal .sa-resume { display:flex;gap:16px;align-items:center;padding:16px 0 24px;border-bottom:1px solid var(--sa-line);margin-bottom:36px; }
#workspace-proposal .sa-resume div { flex:1;min-width:0; }
#workspace-proposal .sa-resume small { display:block;color:var(--sa-muted);font-size:11px;margin-bottom:4px; }
#workspace-proposal .sa-resume strong { display:block;font-weight:500; }
#workspace-proposal .sa-resume p { color:var(--sa-muted);font-size:12px;margin:4px 0 0; }
#workspace-proposal .sa-home-heading { margin-top:36px;margin-bottom:22px; }
#workspace-proposal .sa-home-heading h1 { font-size:25px; }
#workspace-proposal .sa-composer { border:1px solid var(--sa-line);border-radius:15px;background:var(--sa-surface);padding:15px; }
#workspace-proposal .sa-composer textarea { width:100%;min-height:98px;border:0;background:transparent;resize:vertical;outline-offset:4px; }
#workspace-proposal .sa-composer-tools { display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px;color:var(--sa-muted);font-size:12px; }
#workspace-proposal .sa-composer-tools button:last-child { margin-left:auto; }
#workspace-proposal .sa-suggestions { display:flex;flex-wrap:wrap;gap:10px;margin:15px 0 30px; }

          <button type="button" class="sa-nav cursor-interaction" data-go="admin" data-admin-feature hidden aria-label="教研与管理"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span class="sa-nav-label">教研与管理</span></button>
          <button type="button" class="sa-nav cursor-interaction" data-go="settings" aria-label="账号与设置"><i data-lucide="settings-2" aria-hidden="true"></i><span class="sa-nav-label">账号与设置</span></button>

<script>
(() => {
  const root = document.getElementById('workspace-proposal');
  const main = root.querySelector('[data-main]');
  const app = root.querySelector('[data-app]');
  const object = root.querySelector('[data-object]');
  const subject = root.querySelector('[data-subject]');
  const state = { role:'parent', page:'home', tab:'', mode:'craft', object:'a', subject:'math', compact:false, drawer:false, detail:false, draft:'', choice:'', notice:'' };
  const labels = { home:'首页',courses:'课程',tasks:'学习任务',assessment:'知识诊断',reports:'学习报告',calendar:'学习动态',history:'历史',materials:'资料',whiteboards:'AI白板',profiles:'学习档案',settings:'账号与设置',admin:'教研与管理' };
  const subjects = { math:'数学',chinese:'语文',english:'英语',chemistry:'化学' };
  const icons = () => { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:20,height:20,'stroke-width':1.5}}); };
  const textButton = (label, attrs='') => `<button type="button" class="sa-text-button cursor-interaction" ${attrs}>${label}</button>`;
  const button = (label, attrs='', primary=false) => `<button type="button" class="sa-button${primary?' sa-button-primary':''} cursor-interaction" ${attrs}>${label}</button>`;
  const row = (title, description, action, attrs='', icon='file-text', status='') => `<div class="sa-row"><span class="sa-row-icon"><i data-lucide="${icon}" aria-hidden="true"></i></span><div class="sa-row-content"><h3>${title}</h3><p>${description}</p></div>${status?`<span class="sa-status">${status}</span>`:''}${action?button(action,attrs):''}</div>`;
  const heading = (title, description) => `<h1>${title}</h1><p class="sa-description">${description}</p>`;
  const isSelf = () => state.role === 'adult' || state.object === 'self';
  const isChild = () => state.role === 'student';
  const name = () => isSelf() ? '我自己' : state.object === 'b' ? '学习者B' : '学习者A';
  const tabs = (items) => `<div class="sa-tabs" role="tablist" aria-label="${labels[state.page]}分类">${items.map(([key,label])=>`<button type="button" class="sa-tab cursor-interaction" role="tab" aria-selected="${state.tab===key}" data-tab="${key}">${label}</button>`).join('')}</div>`;
  function setPage(page) {
    state.page=page;state.tab='';state.detail=false;state.notice='';state.drawer=false;
    if (isSelf() && ['assessment','reports'].includes(page)) state.page='home';
    if (state.page==='profiles' && state.role!=='parent') state.page='home';
    if (state.page==='admin' && state.role!=='teacher') state.page='home';
    render();
  }
  function scope() {
    root.querySelectorAll('[data-child-feature]').forEach(el=>el.hidden=isSelf());
    root.querySelectorAll('[data-family-feature]').forEach(el=>el.hidden=state.role!=='parent');
    root.querySelectorAll('[data-admin-feature]').forEach(el=>el.hidden=state.role!=='teacher');
    root.querySelector('[data-observe-title]').textContent=isSelf()?'时间安排':'学习观察';
    root.querySelector('[data-identity]').textContent=({parent:'家长账号 · 查看孩子的学习',student:'学生本人 · 学习码身份',adult:'本人账号 · 独立学习',teacher:'教研人员 · 已授权学习视图'})[state.role];
    root.querySelector('[data-object-label]').hidden=state.role==='student'||state.role==='adult';
    root.querySelector('[data-fixed-object]').hidden=state.role!=='student'&&state.role!=='adult';
    root.querySelector('[data-fixed-object]').textContent=state.role==='adult'?'我自己 · 独立学习':'学习者A · 四年级';
    root.querySelector('[data-subject-label]').hidden=isSelf();
    root.querySelectorAll('.sa-nav').forEach(el=>{if(el.dataset.go===state.page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
    root.querySelector('[data-breadcrumb]').textContent='学习工作台 / '+labels[state.page];
    app.classList.toggle('sa-compact',state.compact&&window.innerWidth>1000);
    app.classList.toggle('sa-drawer',state.drawer);
    root.querySelector('[data-mobile-nav]').setAttribute('aria-expanded',String(state.drawer));
    root.querySelector('[data-toggle-nav]').setAttribute('aria-label',window.innerWidth<=1000?'关闭学习导航':state.compact?'展开学习导航':'收起学习导航');
    const sidebar=root.querySelector('.sa-sidebar');
    if(state.drawer){sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');}else{sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');}
    main.inert=state.drawer;
    root.querySelector('.sa-topbar').inert=state.drawer;
  }
  function home() {
    const resume=isSelf()?'继续我的课程':isChild()?'继续上次的学习':'查看接下来的学习安排';
    const action=isSelf()?'继续课程':isChild()?'继续学习':'查看安排';
    return `<div class="sa-resume"><div><small>继续学习</small><strong>${resume}</strong><p>${isSelf()?'课程、对话和白板保留在自己的账号下。':name()+' · '+subjects[state.subject]+' · 从已经保存的位置继续。'}</p></div>${button(action,`data-go="${isSelf()?'courses':'tasks'}"`,true)}</div>
      <div class="sa-tabs" role="tablist" aria-label="工作台学习模式"><button type="button" class="sa-tab cursor-interaction" role="tab" aria-selected="${state.mode==='craft'}" data-mode="craft">Craft Courses</button><button type="button" class="sa-tab cursor-interaction" role="tab" aria-selected="${state.mode==='instant'}" data-mode="instant">Instant Assistance</button></div>
      <div class="sa-home-heading"><h1>${state.mode==='craft'?'你想学些什么？':'想一起看看什么？'}</h1><p class="sa-description">${state.mode==='craft'?'从一个目标，整理一门可以继续学下去的课程。':'从一个问题开始，保留提问、讲解与学习来源。'}</p></div>
      <div class="sa-composer"><textarea aria-label="学习目标或问题" placeholder="${state.mode==='craft'?'描述你想学习的主题，也可以从自己的资料开始…':'想理解一个概念，或换一种方式看看？'}"></textarea><div class="sa-composer-tools">${textButton('资料','data-go="materials"')}<span>·</span>${textButton('学习工具','data-go="whiteboards"')}${button(state.mode==='craft'?'查看课程':'保留问题',state.mode==='craft'?'data-go="courses"':'data-keep-question',true)}</div></div>
      <div class="sa-suggestions">${button('从资料开始','data-go="materials"')}${button('看看已有课程','data-go="courses"')}${button('用白板讲清楚','data-go="whiteboards"')}</div>
      <section class="sa-section"><h2>从课程继续</h2>${row(isSelf()?'我的独立课程':'当前学习课程',isSelf()?'个人阅读、练习与项目分别保存。':subjects[state.subject]+' · 课堂、练习和报告各自保留原始记录。','打开课程','data-go="courses"','graduation-cap','已保存')}</section>`;
  }
  function courses() {
    if(state.detail)return heading('课程目录','课程、课堂、练习、项目在同一位置继续。')+textButton('← 返回课程列表','data-back-detail')+row('概念与示例','从保存的讲解位置继续。','继续课堂','data-local="原课堂位置已选中（预览）"','play')+row('练习与理解检查','首次作答、提示后尝试和订正分别记录。','查看练习','data-open-practice','clipboard-check')+row('课程资料','原页、教学来源与课程版本保留。','查看资料','data-go="materials"','file-text');
    return heading('我的课程','保留现有课程库、筛选、目录和课堂交互。')+row(isSelf()?'社会学入门':'数学 · 余数与除法',isSelf()?'独立课程 · 讲座、微课与项目':'已加入的课程 · 从原单元与课堂继续','继续学习','data-detail','graduation-cap','进行中')+row('从自己的资料创建课程','先核对目标、来源和课程蓝图。','选择资料','data-go="materials"','folder-open')+row('GESP C++','独立认证轨道 · 按等级查看课程与任务','查看轨道','data-local="GESP 课程轨道已选中（预览）"','code-xml');
  }
  function practice() {
    return heading('分组练习','当前练习归属于原安排；答案和理由分别保存。')+textButton('← 返回学习任务','data-back-detail')+(isChild()?`<section class="sa-section"><h2>你会怎样解释这一步？</h2><p>演示题：17个物品每5个分一组。余下2个时，为什么不能再分成一整组？</p><label class="sa-radio"><input type="radio" name="demo-answer" value="enough" ${state.choice==='enough'?'checked':''}> 因为剩下的数量不足5个</label><label class="sa-radio"><input type="radio" name="demo-answer" value="zero" ${state.choice==='zero'?'checked':''}> 因为一组里不能有物品</label><label class="sa-field"><span>说说你的理由</span><textarea data-draft aria-label="我的作答理由" rows="3" placeholder="可以先写下自己的想法。"></textarea></label><div class="sa-page-actions">${button('保留草稿','data-save-draft',true)}${button('看看提示','data-show-hint')}</div><p class="sa-note" data-hint hidden>试着比较：剩下的数量，和一整组需要的数量。</p></section>`:`<section class="sa-section"><h2>查看练习安排</h2><p class="sa-description">这里可以核对目标、分组和保存状态。答案由孩子使用自己的学习码完成。</p>${row('目标与分组','三个知识点，逐组开始；原始回答和帮助记录保留。','','','list-checks')}${row('本人作答','请孩子通过自己的学习入口开始。','','','user-round')}</section>`);
  }
  function tasks() {
    if(state.detail)return practice();
    if(isSelf())return heading('我的学习任务','个人学习安排与课程断点。')+row('继续已保存课程','从原讲座、微课或项目阶段继续。','进入课程','data-go="courses"','graduation-cap')+row('安排下一次学习','在日历查看个人时间安排。','查看日历','data-go="calendar"','calendar-days')+`<p class="sa-note">成人对话练习与自动教学链路仍在后续开发范围内。</p>`;
    if(!state.tab)state.tab='today';
    const header=heading('学习任务',name()+' · '+subjects[state.subject]+' · 今日、指导、错题和复测归在一起。')+tabs([['today','今日任务'],['plans','指导计划'],['mistakes','错题与订正'],['reviews','复测']]);
    if(state.tab==='plans')return header+row('按真实报告安排下一步','核对来源、目标与每日负担后，再确认执行。',isChild()?'查看安排':'核对计划','data-local="原指导计划详情已选中（预览）"','route','待确认')+row('查看计划依据','回到产生这份计划的原始报告。','查看报告','data-go="reports"','chart-no-axes-combined');
    if(state.tab==='mistakes')return header+row('余数与分组的解释','原始答案、提示与后续订正分别保留。','查看订正','data-open-practice','notebook-pen','有原始记录');
    if(state.tab==='reviews')return header+row('到期再看看是否保持','原任务、真实间隔与新独立题分别核对。','查看安排','data-go="calendar"','calendar-clock','等待真实到期')+`<p class="sa-note">日历完成与独立复测结果分别显示。</p>`;
    return header+row('继续上次的课堂','回到原句，继续看清一个概念。','继续课堂','data-go="courses"','play','有断点')+row('一组知识点练习','逐组作答，保留答案、解释和帮助记录。',isChild()?'开始练习':'查看安排','data-open-practice','list-checks','待开始')+row('核对学习计划','查看原报告与下一步任务。',isChild()?'查看计划':'核对计划','data-tab="plans"','route','待确认');
  }
  function assessment() {
    if(!state.tab)state.tab='scope';
    const header=heading('知识诊断','先确认已学范围，再预览题量，从原会话继续。')+tabs([['scope','学习范围'],['sessions','测评记录']]);
    if(state.tab==='sessions')return header+row('已保存的测评','保留原范围、首答和测量版本。','查看报告','data-go="reports"','clipboard-check','已保存')+row('尚未完成的测评','继续原题目和草稿。','继续测评','data-local="原测评会话已选中（预览）"','play');
    return header+row(name()+'的学习范围',subjects[state.subject]+' · 确认教材、学期和已学内容。',isChild()?'查看范围':'核对范围','data-local="当前已学范围已展开（预览）"','book-open','待核对')+`<p class="sa-note">未学内容不会直接列为薄弱项；查看页面不会自动开始测评。</p><div class="sa-page-actions">${button('查看测评预览','data-local="测评蓝图预览已打开（预览）"',true)}${button('查看已有报告','data-go="reports"')}</div>`;
  }
  function reports() {
    if(!state.tab)state.tab='reports';
    const header=heading('学习报告','看清已有证据、未知和待验证原因，再决定下一步。')+tabs([['reports','评测报告'],['knowledge','知识掌握'],['reasons','原因验证'],['retention','复盘']]);
    if(state.tab==='knowledge')return header+row('概念理解','查看具体目标、原题和已有表现。','展开依据','data-local="知识点原始依据已展开（预览）"','network','仍需补证据')+row('迁移与保持','尚未取得足够独立证据。','查看下一步','data-go="tasks"','git-branch','保持未知');
    if(state.tab==='reasons')return header+row('读题条件遗漏','这是待验证解释；需要支持、替代解释和反证。','查看原题','data-local="原始作答与原因探针已定位（预览）"','search','待验证')+row('针对当前卡点安排核查','指导引用原报告，不把聊天线索直接当能力结论。','查看指导计划','data-open-plans','route');
    if(state.tab==='retention')return header+row('指导执行与保持结果','分别查看任务执行、独立复测和前后可比范围。','查看复测任务','data-open-reviews','history','等待后续证据');
    return header+row(subjects[state.subject]+' · 原测评报告','冻结范围、题目、首答和版本均可追溯。','查看具体知识','data-tab="knowledge"','chart-no-axes-combined','已保存')+`<div class="sa-report-grid"><article><h2>已经观察到什么</h2><p>从具体作答说明本次表现，保留提示和订正的区别。</p></article><article><h2>还需要知道什么</h2><p>对迁移、保持与错误原因保留未知和待验证状态。</p></article></div><div class="sa-page-actions">${button('查看指导计划','data-open-plans',true)}${button('核对原因','data-tab="reasons"')}</div><details class="sa-inline-details"><summary>这些安排依据了什么</summary><p>查看原报告、知识定义、学习记忆来源和真实证据。缺少证据的判断继续保持未确定。</p></details>`;
  }
  function calendar() {
    return heading('学习动态','日历与学习安排 · 保留现有日历、来源与 ICS 交互。')+row('今天 · 继续一节课','个人或当前孩子的原学习活动。','打开课程','data-go="courses"','calendar-days','已安排')+row('接下来 · 一组练习','从具体安排打开本人任务。','查看任务','data-go="tasks"','list-checks','待执行')+(!isSelf()?row('到期复测','实际到期后进入原 review 任务；完成日程不替代复测证据。','查看复测','data-open-reviews','calendar-clock','按原计划'):row('个人课程安排','保留本人课程和日程的对应关系。','查看课程','data-go="courses"','graduation-cap'))+`<details class="sa-inline-details"><summary>日历来源与同步</summary><p>手动安排、指导计划与只读订阅分别显示；ICS 保持原有导入、同步和导出边界。</p></details>`;
  }
  function history() {
    return heading('学习历史','从已保存活动回到原课程、原对话与原记录。')+row('课程学习记录','原课程 · 原单元 · 已保存断点','继续课程','data-go="courses"','history')+row('一次即时帮助','提问与回复、采用的笔记和来源。','回到帮助','data-open-assistant','messages-square')+row('白板讲解记录','保留来源、编辑稿与播放位置。','打开白板','data-go="whiteboards"','presentation')+(!isSelf()?row('知识诊断记录','原会话与原报告互相定位。','查看报告','data-go="reports"','clipboard-check'):'');
  }
  function materials() {
    if(!state.tab)state.tab='files';
    if(isChild()&&state.tab==='papers')state.tab='files';
    const options=[['files','个人资料'],...(!isChild()?[['papers','题卷资源']]:[]),['packs','个性化学案']];
    const header=heading('资料','个人资料、题卷与学案在同一入口，来源与授权分别保留。')+tabs(options);
    if(state.tab==='papers')return header+row('查找合适的题卷','按年级、学科、版本与完整度检索；原卷和答案状态分开。','查看原卷','data-local="原卷与完整度详情已选中（预览）"','files')+row('已选择的题目','明确选择后进入原卷练习。','查看选题','data-open-practice','list-checks');
    if(state.tab==='packs')return header+row('按目标整理的学案','目标、来源、讲义和练习保留原版本。','查看学案','data-local="原学案详情已打开（预览）"','book-open','待核对');
    return header+row('自己的学习资料.pdf','原件、页级处理和人工核对分别保留。','查看原页','data-local="个人 PDF 原页已选中（预览）"','file-text','已保存')+row('从资料整理课程','核对原页、目标和蓝图后再确认课程。','进入来源课程','data-go="courses"','graduation-cap')+`<p class="sa-note">${isSelf()?'成人资料使用本人合法能力；儿童专属处理仍按实际资格显示。':'当前资料只展示本人或已授权孩子的内容。'}</p>`;
  }
  function whiteboards() {
    return heading('AI白板','沿用现有生成、来源核对、编辑、采用和播放体验。')+row('把一个问题讲清楚','从问题或合法对话来源整理教学稿。','查看教学稿','data-local="白板教学稿编辑位置已选中（预览）"','presentation','待核对')+row('已保存的白板','从原幕与原句继续，保留图片和声音状态。','继续播放','data-local="原白板播放位置已选中（预览）"','play','已保存');
  }
  function profiles() {
    return heading('学习档案','档案、授权、学习码与设备归在这里。')+row('学习者A · 四年级','年级属于档案；每门学科的已学范围分别确认。','选择档案','data-select-a','user-round')+row('学习者B · 九年级','切换后保留所在功能区，读取新的合法范围。','选择档案','data-select-b','user-round')+row('授权与学习码','监护绑定、教师授权、本人设备和学习码。','查看管理','data-local="授权与学习码管理已选中（预览）"','key-round')+row('核对已学范围','在诊断区确认教材、学期与已学内容。','前往核对','data-go="assessment"','book-open');
  }
  function settings() {
    return heading('账号与设置','账号和数据管理集中在底部入口，课堂设置留在播放器中。')+row('当前账号','身份、登录状态和设备信息。','查看账号','data-local="当前账号信息已展开（预览）"','user-round')+(!isChild()?row('数据管理','保留原有下载、删除确认与影响说明。','查看数据管理','data-local="数据管理入口已选中，预览不执行下载或删除"','database'):'')+row('教学播放设置','音色、速度、字体与背景在原播放器中调整。','回到课程','data-go="courses"','volume-2');
  }
  function admin() {
    return heading('教研与管理','各项入口按当前账号的真实权限提供。')+row('课程覆盖与内容','教材、课时、原子知识、题目与版本审核。','查看课程覆盖','data-local="课程覆盖工作区已选中（预览）"','book-open')+row('导入与处理','资料来源、原件、处理任务与人工核对。','查看导入','data-local="资料导入工作区已选中（预览）"','folder-open')+row('作答复核与测量','原回答、媒体、评分依据与定义版本。','查看复核','data-local="作答复核工作区已选中（预览）"','clipboard-check')+row('GESP 与 AI教研','研究、试点内容和实际工具资格分别管理。','查看教研','data-local="教研工作区已选中（预览）"','code-xml');
  }
  function render() {
    const pages={home,courses,tasks,assessment,reports,calendar,history,materials,whiteboards,profiles,settings,admin};
    scope();
    main.innerHTML=pages[state.page]()+`<div class="sa-live" role="status" aria-live="polite" data-live></div>`;
    if(main.querySelector('[data-draft]'))main.querySelector('[data-draft]').value=state.draft;
    main.querySelector('[data-live]').textContent=state.notice;
    icons();
  }
  root.addEventListener('click',event=>{
    const target=event.target.closest('button');
    if(!target||!root.contains(target))return;
    if(target.hasAttribute('data-go'))return setPage(target.dataset.go);
    if(target.hasAttribute('data-tab')){state.tab=target.dataset.tab;state.notice='';return render();}
    if(target.hasAttribute('data-mode')){state.mode=target.dataset.mode;return render();}
    if(target.hasAttribute('data-toggle-nav')){if(window.innerWidth<=1000)state.drawer=false;else state.compact=!state.compact;return scope();}
    if(target.hasAttribute('data-mobile-nav')){state.drawer=true;scope();root.querySelector('[data-toggle-nav]').focus();return;}
    if(target.hasAttribute('data-close-nav')){state.drawer=false;scope();root.querySelector('[data-mobile-nav]').focus();return;}
    if(target.hasAttribute('data-detail')){state.detail=true;return render();}
    if(target.hasAttribute('data-back-detail')){state.detail=false;return render();}
    if(target.hasAttribute('data-open-practice')){state.page='tasks';state.tab='today';state.detail=true;state.drawer=false;return render();}
    if(target.hasAttribute('data-open-plans')){state.page='tasks';state.tab='plans';state.detail=false;state.drawer=false;return render();}
    if(target.hasAttribute('data-open-reviews')){state.page='tasks';state.tab='reviews';state.detail=false;state.drawer=false;return render();}
    if(target.hasAttribute('data-open-assistant')){state.page='home';state.mode='instant';return render();}
    if(target.hasAttribute('data-select-a')||target.hasAttribute('data-select-b')){state.object=target.hasAttribute('data-select-a')?'a':'b';object.value=state.object;state.notice='已切换到'+name()+'（预览）';return render();}
    if(target.hasAttribute('data-save-draft')){state.notice='草稿已保留（仅此方案预览）';main.querySelector('[data-live]').textContent=state.notice;return;}
    if(target.hasAttribute('data-show-hint')){main.querySelector('[data-hint]').hidden=false;state.notice='这次帮助与独立首答分开记录（预览）';main.querySelector('[data-live]').textContent=state.notice;return;}
    if(target.hasAttribute('data-keep-question')){const value=main.querySelector('.sa-composer textarea').value;state.notice=value?'问题已保留在此预览中；未发送模型请求。':'先写下想一起看看的问题。';main.querySelector('[data-live]').textContent=state.notice;return;}
    if(target.hasAttribute('data-local')){state.notice=target.dataset.local;main.querySelector('[data-live]').textContent=state.notice;}
  });
  root.addEventListener('input',event=>{if(event.target.hasAttribute('data-draft'))state.draft=event.target.value;});
  root.addEventListener('change',event=>{
    if(event.target.hasAttribute('data-demo-role')){state.role=event.target.value;state.object=state.role==='adult'?'self':'a';object.value=state.object;state.subject='math';subject.value='math';state.draft='';state.choice='';setPage('home');}
    else if(event.target===object){state.object=object.value;state.draft='';state.choice='';state.detail=false;state.notice='';if(isSelf()&&['assessment','reports'].includes(state.page))state.page='home';render();}
    else if(event.target===subject){state.subject=subject.value;state.draft='';state.choice='';state.detail=false;state.notice='';render();}
    else if(event.target.name==='demo-answer'){state.choice=event.target.value;}
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.drawer){state.drawer=false;scope();root.querySelector('[data-mobile-nav]').focus();}
    if(event.key==='Tab'&&state.drawer){const sidebar=root.querySelector('.sa-sidebar');const focusable=[...sidebar.querySelectorAll('button,summary')].filter(el=>!el.hidden&&el.getClientRects().length);const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  window.addEventListener('resize',()=>{if(window.innerWidth>1000)state.drawer=false;scope();});
  render();
})();
</script>
