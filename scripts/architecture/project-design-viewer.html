<style>
:root{--paper:#f5f3ed;--sheet:#fffcf5;--ink:#25392f;--muted:#626c65;--line:#d9dfd2;--green:#1f543f;--tint:#e9efe4;--accent:#b14f2b;--mono:Consolas,"Liberation Mono",monospace;--sans:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.75}a{color:var(--green);text-underline-offset:3px;overflow-wrap:anywhere}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{color:inherit}code{font-family:var(--mono);font-size:.9em;overflow-wrap:anywhere}.skip{position:absolute;top:-60px;left:14px;background:var(--ink);color:white;padding:9px;z-index:4}.skip:focus{top:8px}.masthead{padding:28px 32px 22px;border-bottom:2px solid var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent);margin:0 0 10px}h1{font-family:"Noto Serif CJK SC","Source Han Serif SC",SimSun,serif;font-size:29px;font-weight:600;letter-spacing:.04em;line-height:1.4;margin:0}.intro{margin:7px 0 0;color:var(--muted);max-width:850px}.metrics{display:flex;gap:23px;white-space:nowrap}.metric strong{display:block;font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2}.metric span{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:18px;align-items:center;padding:17px 32px;border-bottom:1px solid var(--line);background:var(--sheet)}.searchbox{display:flex;align-items:center;gap:10px;flex:1;max-width:650px}.searchbox label{font-weight:600;white-space:nowrap}.searchbox input{width:100%;min-width:0;border:1px solid #adb9ad;background:#fffefb;border-radius:3px;padding:9px 12px;color:var(--ink)}.toolbar nav{display:flex;gap:15px;flex-wrap:wrap;font-size:12px}.workbench{display:grid;grid-template-columns:220px 305px minmax(0,1fr);min-height:calc(100vh - 245px)}.domains{padding:22px 12px 24px 22px;border-right:1px solid var(--line)}.label{margin:0 0 12px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}.domain{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;padding:9px 10px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;font-size:12px;line-height:1.6;margin:0 0 3px}.domain:hover{background:#edf0e7}.domain[aria-pressed="true"]{border-left-color:var(--green);background:var(--tint);font-weight:600}.domain .number{color:var(--muted);font:11px var(--mono)}.index{border-right:1px solid var(--line);min-width:0;background:#faf9f3}.indexhead{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.indexhead .label{margin:0}.clear{font-size:11px;border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;padding:2px}.results{max-height:calc(100vh - 300px);min-height:280px;overflow-y:auto;padding:0 9px 14px;scrollbar-width:thin}.feature{display:block;background:transparent;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 12px}.feature:hover{background:#edf0e7}.feature[aria-current="true"]{background:var(--green);color:#fffdf6}.feature .fid{display:block;font:11px var(--mono);letter-spacing:.04em;margin-bottom:4px;color:var(--muted)}.feature[aria-current="true"] .fid{color:#cbdccf}.feature .ftitle{font-size:13px;font-weight:600;line-height:1.65}.empty{padding:20px;color:var(--muted)}.detail{min-width:0;padding:29px 36px 50px;background:var(--sheet)}.detail .kicker{font:11px var(--mono);color:var(--accent);letter-spacing:.04em;margin:0 0 8px}.detail h2{font-family:"Noto Serif CJK SC",SimSun,serif;font-size:25px;line-height:1.55;margin:0 0 12px}.detail .meta{color:var(--muted);font-size:12px;margin:0 0 22px;padding-bottom:19px;border-bottom:1px solid var(--line)}.detail h3{font-size:12px;margin:25px 0 8px;letter-spacing:.04em}.detail p{margin:6px 0;overflow-wrap:anywhere}.detail ol,.detail ul{padding-left:22px;margin:8px 0}.detail li{margin-bottom:8px;overflow-wrap:anywhere}.boundary{border-left:3px solid var(--accent);padding:1px 15px;background:#f5f0e5;margin:22px 0}.boundary h3{margin:11px 0 5px}.boundary p{padding-bottom:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 8px;border:1px solid var(--line);font:11px/1.7 var(--mono);max-width:100%;overflow-wrap:anywhere}.endpoint{list-style:none;padding:9px 0;border-bottom:1px solid var(--line)}.endpoints{padding-left:0!important}.endpoint .method{font:11px var(--mono);color:var(--accent);margin-right:7px}.endpoint .binding{display:block;font:11px/1.8 var(--mono);color:var(--muted);margin-top:5px}.links{font-size:12px}.notice{font-size:12px;color:var(--muted);padding:19px 32px;border-top:1px solid var(--line)}.mobile-link{display:none}.source{font:11px/1.7 var(--mono)}
@media(min-width:1500px){.workbench{grid-template-columns:250px 350px minmax(0,1fr)}.detail{padding-left:48px;padding-right:64px}}
@media(max-width:1050px){.masthead{padding:24px}.toolbar{padding:15px 24px;flex-wrap:wrap}.searchbox{max-width:none;flex-basis:100%}.workbench{grid-template-columns:180px 235px minmax(0,1fr)}.domains{padding-left:10px}.detail{padding:24px}.detail h2{font-size:22px}.metrics{gap:16px}.metric strong{font-size:22px}}
@media(max-width:760px){.masthead{grid-template-columns:1fr;padding:20px;gap:18px}h1{font-size:25px}.intro{font-size:12px}.metrics{gap:28px}.metric{display:flex;gap:8px;align-items:baseline}.metric strong{font-size:22px}.toolbar{padding:14px 20px;gap:12px}.searchbox{gap:8px}.searchbox input{font-size:13px}.toolbar nav{gap:14px;font-size:11px}.workbench{display:block;min-height:0}.domains{border-right:0;border-bottom:1px solid var(--line);padding:13px 16px}.domains .label{margin-bottom:6px}.domain-list{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px}.domain{flex:0 0 auto;width:auto;max-width:215px;margin:0;border-left:0;border-bottom:2px solid transparent;padding:7px 9px;white-space:nowrap;font-size:11px}.domain[aria-pressed="true"]{border-bottom-color:var(--green)}.index{border-right:0;border-bottom:1px solid var(--line)}.indexhead{padding:14px 20px 9px}.results{max-height:240px;min-height:0;padding:0 12px 10px}.feature{padding:10px 12px}.feature .fid{display:inline-block;min-width:76px;margin:0 8px 0 0}.feature .ftitle{font-size:12px}.detail{padding:23px 20px 35px}.detail h2{font-size:23px}.detail .meta{font-size:11px}.mobile-link{display:inline-block;font-size:11px;margin-top:8px}.notice{padding:17px 20px;font-size:11px}}
@media print{.toolbar,.domains,.index,.notice,.mobile-link{display:none}.workbench{display:block}.masthead{padding:0 0 15px}.detail{padding:20px 0}.metrics{display:none}body,.detail{background:white}a{color:inherit}}
</style>
</head>
<body>
<a class="skip" href="#feature-detail">跳到功能详情</a>
<header class="masthead">
 <div><p class="eyebrow">STUDYAGENT / ENGINEERING HANDBOOK / 2026.10</p><h1>功能与设计总册</h1><p class="intro">从用户目标到领域处理、数据和源码。按领域浏览，或搜索功能编号、接口、方法与关键词。</p></div>
 <div class="metrics" aria-label="当前整理范围"><div class="metric"><strong id="areas-count"></strong><span>功能领域</span></div><div class="metric"><strong id="features-count"></strong><span>功能条目</span></div><div class="metric"><strong id="routes-count"></strong><span>当前正常API</span></div></div>
</header>
<div class="toolbar"><div class="searchbox"><label for="search">检索</label><input id="search" type="search" placeholder="知识点、MEA-02、ICS、expectedRevision…" autocomplete="off" spellcheck="false"></div><nav aria-label="设计文档"><a href="README.md">阅读总入口</a><a href="02-high-level-design.md">概要设计</a><a href="03-core-detailed-design.md">核心详细设计</a><a href="04-data-and-state-design.md">数据与状态</a><a href="06-boundaries-and-follow-ups.md">边界与后续</a></nav></div>
<main class="workbench"><aside class="domains" aria-label="功能领域"><p class="label">01 / 领域导航</p><div id="domain-list" class="domain-list"></div></aside><section class="index" aria-label="功能目录"><div class="indexhead"><p id="result-count" class="label" aria-live="polite"></p><button id="clear" class="clear" type="button">重置筛选</button></div><div id="results" class="results"></div></section><article id="feature-detail" class="detail" tabindex="-1" aria-label="功能详情"></article></main>
<footer class="notice">源码基线 <code id="revision"></code> · 数据全部内嵌，可离线使用。测试链接表示关联验证入口；实现存在不代表真人教学效度或全部目标已验收。<a href="generated/design-validation.json">整理验证收据</a></footer>
<noscript><p class="notice">浏览器未启用JavaScript。请打开 <a href="README.md">Markdown总册</a> 查看全部设计。</p></noscript>
<script type="application/json" id="catalog">__PROJECT_DESIGN_CATALOG__</script>
<script>
'use strict';
const catalog=JSON.parse(document.getElementById('catalog').textContent);
const all=catalog.areas.flatMap(area=>area.features.map(feature=>({...feature,areaTitle:area.title,areaData:area})));
const byId=new Map(all.map(feature=>[feature.id,feature]));
const search=document.getElementById('search'),results=document.getElementById('results'),detail=document.getElementById('feature-detail');
let domain='all',selected=byId.has(location.hash.slice(1))?location.hash.slice(1):all[0].id;
const el=(tag,text,className)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;};
const searchText=new Map(all.map(({areaData,...feature})=>[feature.id,JSON.stringify(feature).toLocaleLowerCase()]));
document.getElementById('areas-count').textContent=catalog.counts.areas;
document.getElementById('features-count').textContent=catalog.counts.features;
document.getElementById('routes-count').textContent=catalog.counts.activeNormalApiRoutes;
document.getElementById('revision').textContent=catalog.sourceRevision.slice(0,12);
function link(label,file,line){const node=el('a',label);node.href='../../'+file+(line?'#L'+line:'');return node;}
function domains(){const host=document.getElementById('domain-list');host.replaceChildren();for(const area of [{id:'all',title:'全部领域',features:all},...catalog.areas]){const button=el('button',undefined,'domain');button.type='button';button.dataset.domain=area.id;button.setAttribute('aria-pressed',String(domain===area.id));button.append(el('span',area.title),el('span',area.features.length,'number'));button.addEventListener('click',()=>{domain=area.id;domains();renderResults(true);});host.append(button);}}
function filtered(){const terms=search.value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);return all.filter(feature=>(domain==='all'||feature.area===domain)&&terms.every(term=>searchText.get(feature.id).includes(term)));}
function select(id,updateHash=true){selected=id;if(updateHash&&location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);renderResults(false);renderDetail(byId.get(id));}
function renderResults(choose){const rows=filtered();document.getElementById('result-count').textContent='02 / 功能目录 · '+rows.length+' 项';results.replaceChildren();if(choose&&!rows.some(row=>row.id===selected)){selected=rows[0]?.id||null;renderDetail(selected?byId.get(selected):null);}if(!rows.length){results.append(el('p','没有匹配项。可缩短关键词或重置领域筛选。','empty'));return;}for(const feature of rows){const button=el('button',undefined,'feature');button.type='button';button.dataset.feature=feature.id;button.setAttribute('aria-current',String(selected===feature.id));button.append(el('span',feature.id,'fid'),el('span',feature.title,'ftitle'));button.addEventListener('click',()=>select(feature.id));results.append(button);}}
function section(title,text){detail.append(el('h3',title),el('p',text));}
function fileList(title,files){detail.append(el('h3',title));const list=el('ul',undefined,'links');for(const file of files){const row=el('li');row.append(link(file,file));list.append(row);}detail.append(list);}
function renderDetail(feature){detail.replaceChildren();if(!feature){detail.append(el('h2','未找到功能'),el('p','调整关键词或选择其他领域，即可继续查阅。'));return;}detail.dataset.feature=feature.id;detail.append(el('p',feature.id+' / '+feature.areaTitle,'kicker'),el('h2',feature.title));const meta=el('div',undefined,'meta');meta.append(el('p','适用角色：'+feature.actors),el('p','所属领域入口：'+feature.pages.join('、')),el('p',feature.status==='historical-read-only-and-redirect'?'状态：历史只读与兼容重定向':'状态：当前接入实现；限制见下文'));detail.append(meta);section('输入与触发',feature.inputs);detail.append(el('h3','处理与实现'));const steps=feature.implementation.split('；').filter(Boolean);if(steps.length>1){const ol=el('ol');steps.forEach(step=>ol.append(el('li',step)));detail.append(ol);}else detail.append(el('p',feature.implementation));section('输出与结果',feature.outputs);detail.append(el('h3','状态与持久化'));if(feature.collections.length){const chips=el('div',undefined,'chips');feature.collections.forEach(value=>chips.append(el('span',value,'chip')));detail.append(chips);}else detail.append(el('p','复用调用上下文、独立索引、SQL任务表或文件资产；不另造业务集合。'));const boundary=el('aside',undefined,'boundary');boundary.append(el('h3','权限、失败与边界'),el('p',feature.limits));detail.append(boundary);detail.append(el('h3','关联接口'));if(feature.endpoints.length){const list=el('ul',undefined,'endpoints');for(const endpoint of feature.endpoints){const row=el('li',undefined,'endpoint');row.append(el('span',endpoint.verb,'method'),el('code',endpoint.path));const binding=el('span',undefined,'binding');binding.append(document.createTextNode(endpoint.controller+'.'+endpoint.method+' → '),link(endpoint.file+':'+endpoint.line,endpoint.file,endpoint.line));row.append(binding);list.append(row);}detail.append(list);}else detail.append(el('p','领域内部计算、浏览器交互或运维命令，通过上层功能触发；没有独立HTTP端点。'));if(feature.implementations.length){detail.append(el('h3','服务方法'));const list=el('ul',undefined,'source');for(const method of feature.implementations){const row=el('li');row.append(link(method.name+' · '+method.file+':'+method.line,method.file,method.line));list.append(row);}detail.append(list);}const extras=feature.sourceFiles.filter(file=>!feature.implementations.some(method=>method.file===file));if(extras.length)fileList('补充实现文件',extras);fileList('领域契约',feature.areaData.contracts);fileList('关联验证入口',feature.tests);detail.append(el('p','这些测试文件是领域关联证据，不能视为每个交互、每台设备或教学有效性均已验收。','intro'));const more=el('p');const areaIndex=catalog.areas.findIndex(area=>area.id===feature.area);const md=el('a','打开该领域完整设计');md.href='details/'+String(areaIndex+1).padStart(2,'0')+'-'+feature.area+'.md';more.append(md);detail.append(more);const top=el('a','返回功能目录','mobile-link');top.href='#results';detail.append(top);}
search.addEventListener('input',()=>renderResults(true));
document.getElementById('clear').addEventListener('click',()=>{domain='all';search.value='';domains();renderResults(true);search.focus();});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id)){domain='all';search.value='';domains();select(id,false);}});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();search.focus();}if(event.key==='Escape'&&document.activeElement===search){search.value='';renderResults(true);}});
domains();renderResults(false);renderDetail(byId.get(selected));
</script>
</body>
</html>
