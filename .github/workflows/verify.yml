name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    # Covers fresh media installation, the full API suite and every persisted
    # content-upgrade journey. Dependency mirror delays consume this budget too.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install document test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/processing/requirements-ci.txt
      - name: Dense PDF originals retain complete text and lines
        run: |
          python scripts/processing/test_complete_pdf_text.py
          python scripts/processing/test_studio_checkpoints.py
          python scripts/processing/test_file_leases.py
          python scripts/qa/verify-project-file-preview.py data/qa/project-files-native-preview.json
      - name: Verify official Ubuntu mirror configuration
        run: node --test scripts/ci/configure-ubuntu-packages.test.cjs
      - name: Configure official Ubuntu package sources
        run: sudo node scripts/ci/configure-ubuntu-packages.cjs
      - name: Install media tools
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Prepare configuration
        run: cp .env.example .env
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Local documentation links
        run: npm run qa:docs
      - name: Read-only private material inventory and reference integrity
        run: node --test scripts/operations/material-audit.test.cjs
      - name: Authored teaching coverage and measurement material audit
        run: node scripts/qa/audit-authored-curriculum.cjs data/qa/authored-curriculum-audit.json
      - name: Current eligible material coverage, formal teacher roles and read-only history across restarts
        run: node scripts/qa/verify-material-coverage.cjs data/qa/material-coverage-runtime.json sqlite
      - name: GESP authored content and assisted guidance retention journey
        run: |
          node scripts/qa/audit-gesp-student-curriculum.cjs data/qa/gesp-student-content-audit-v2.json
          node scripts/qa/verify-gesp-learning-loop.cjs data/qa/gesp-learning-loop-sqlite.json sqlite
      - name: All authored math and English contrasts, persisted case grading and historical content upgrade
        run: node scripts/qa/verify-verification-groups.cjs data/qa/verification-groups-content-upgrade-runtime.json sqlite content-upgrade
      - name: Canonical original spatial assets and independent image decoding
        run: node scripts/qa/verify-spatial-assets.cjs data/qa/spatial-assets.json
      - name: Canonical minute-hand and oriented-map assets and independent image decoding
        run: node scripts/qa/verify-data-assets.cjs data/qa/data-assets.json
      - name: Canonical boundary, coverage and area-unit assets and independent image decoding
        run: node scripts/qa/verify-geometry-assets.cjs data/qa/geometry-assets.json
      - name: Canonical fourth-grade angles, triangles and bar charts and independent image decoding
        run: node scripts/qa/verify-fourth-grade-geometry-statistics-assets.cjs data/qa/fourth-grade-geometry-statistics-assets.json
      - name: Curriculum package persistence and safe seed enrichment
        run: node scripts/qa/verify-curriculum-packages.cjs data/qa/curriculum-package-runtime.json
      - name: Reviewed textbook TOCs and frozen progress recovery
        run: node scripts/qa/verify-textbook-chapters.cjs data/qa/textbook-chapters-runtime.json
      - name: Frozen measurement definitions and comparable evidence
        run: node scripts/qa/verify-measurement-definitions.cjs data/qa/measurement-definition-runtime.json
      - name: Reviewed authored prerequisite upgrade, interrupted startup and historical evidence
        run: node scripts/qa/verify-authored-relations.cjs data/qa/authored-relations-runtime.json sqlite
      - name: Reviewed atomic child relationship and component bindings across upgrades
        run: node scripts/qa/verify-authored-relations.cjs data/qa/atomic-components-relations-runtime.json sqlite atomic
      - name: Atomic component observation, independent measurement and delayed review recovery
        run: node scripts/qa/verify-atomic-components.cjs data/qa/atomic-components-runtime.json sqlite
      - name: Reviewed average denominator relationship and historical mapping protection
        run: node scripts/qa/verify-authored-relations.cjs data/qa/average-count-relations-runtime.json sqlite average
      - name: Average denominator independent measurement and delayed review recovery
        run: node scripts/qa/verify-atomic-components.cjs data/qa/average-count-atomic-runtime.json sqlite average
      - name: Assessment preview, partial evidence and state recovery
        run: node scripts/qa/verify-assessment-blueprints.cjs data/qa/assessment-blueprint-runtime.json
      - name: Original paper measurement review and publication recovery
        run: node scripts/qa/verify-measurement-content.cjs data/qa/measurement-content-runtime.json
      - name: Mistake organization, frozen redo and independent verification recovery
        run: node scripts/qa/verify-notebook.cjs data/qa/notebook-runtime.json
      - name: Asset audit tool regression
        run: python scripts/assets/test_audit_archive_sensitive.py
      - name: Public textbook capture and source-bound chapter review
        run: |
          python scripts/assets/test_capture_textbook_sources.py
          python scripts/assets/test_reviewed_textbook_chapters.py
          python scripts/assets/test_textbook_mapping_candidates.py
          python scripts/assets/test_chinatextbook_primary_sources.py
          python scripts/assets/test_chinatextbook_source_metadata.py
          python scripts/assets/test_chinatextbook_coldarchive_index.py
      - name: Independent recovery verifier regression
        run: python scripts/qa/test_verify_restored_assets.py
      - name: Source release privacy and tamper boundary regression
        run: python scripts/operations/test_package_source.py

  browser:
    runs-on: ubuntu-24.04
    # Includes complete source-course and adult-unit journeys in addition to
    # the existing full suite, fresh browser dependencies and production build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PDF dependencies for browser worker
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2" "Pillow>=10,<13"
      - name: Prepare configuration
        run: cp .env.example .env
      - run: npm ci
      - name: Configure official Ubuntu package mirror for browser verification
        run: sudo node scripts/ci/configure-ubuntu-packages.cjs
      - name: Install attachment audio decoder
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install browser runtime
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: npx playwright install --with-deps chromium
      - name: Browser product journey at phone, tablet and desktop widths
        run: npm run test:e2e
      - name: Preserve browser reports and original traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-evidence
          retention-days: 14
          path: |
            test-results/browser-product-acceptance/
            data/qa/source-course-full-browser.json

  postgres:
    runs-on: ubuntu-24.04
    # Includes every native restore/teaching journey and fresh media dependencies.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: study_qa_admin
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: study_agent_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study_qa_admin -d study_agent_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare configuration
        run: cp .env.example .env
      - run: npm ci
      - name: Configure official Ubuntu package sources
        run: sudo node scripts/ci/configure-ubuntu-packages.cjs
      - name: Prepare isolated PostgreSQL roles and client tools
        env:
          PGPASSWORD: local_ci_only
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          packages=(postgresql-client-16)
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then packages+=(ffmpeg); fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y "${packages[@]}"
          ffmpeg -version
          ffprobe -version
          psql -h 127.0.0.1 -U study_qa_admin -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE study_agent_app LOGIN PASSWORD 'local_ci_app_only';"
          psql -h 127.0.0.1 -U study_qa_admin -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE study_agent_qa OWNER TO study_agent_app;"
      - run: npm run build --workspace @study-agent/contracts
      - run: npm run build --workspace @study-agent/config
      - run: npm run build --workspace @study-agent/api
      - name: PostgreSQL migration, recovery and fencing
        working-directory: apps/api
        env:
          STUDY_TEST_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_POSTGRES_ADMIN_URL: postgresql://study_qa_admin:local_ci_only@127.0.0.1:5432/postgres
          STUDY_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: node --env-file=../../.env ../../node_modules/vitest/vitest.mjs run src/infrastructure/postgres.integration.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install source-course PDF test dependencies
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2" "Pillow>=10,<13"
      - name: Source-course staged generation and checkpoint recovery on PostgreSQL
        working-directory: apps/api
        env:
          STUDY_TEST_SOURCE_COURSE_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
        run: node --env-file=../../.env ../../node_modules/vitest/vitest.mjs run src/modules/learning/source-course.integration.test.ts
      - name: Classroom image task lifecycle and private references on PostgreSQL
        working-directory: apps/api
        env:
          STUDY_TEST_CLASSROOM_VISUAL_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
        run: node --env-file=../../.env ../../node_modules/vitest/vitest.mjs run src/modules/learning/classroom-visual.integration.test.ts
      - name: Long-source chunks, independent checkpoints and original files on PostgreSQL
        working-directory: apps/api
        env:
          STUDY_TEST_SOURCE_COMPILATION_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
        run: node --env-file=../../.env ../../node_modules/vitest/vitest.mjs run src/modules/learning/source-course-compilation.integration.test.ts
      - name: Resumable PDF uploads, page recovery, collection and read-only audit on PostgreSQL
        working-directory: apps/api
        env:
          STUDY_TEST_ORIGINAL_REPAIR_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_MATERIAL_UPLOAD_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_FILE_COORDINATION_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_MATERIAL_MAINTENANCE_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_MATERIAL_INTEGRITY_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_MATERIAL_RESTORE_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_POSTGRES_RESTORE_IMPORT_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_POSTGRES_RESTORE_RESUME_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
          STUDY_TEST_POSTGRES_ADMIN_URL: postgresql://study_qa_admin:local_ci_only@127.0.0.1:5432/postgres
          STUDY_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: node --env-file=../../.env ../../node_modules/vitest/vitest.mjs run src/modules/learning/studio-original-repair.integration.test.ts src/modules/learning/studio-material-upload.integration.test.ts src/infrastructure/studio-file-coordination.test.ts src/modules/learning/studio-material-maintenance.integration.test.ts src/modules/learning/studio-material-integrity.integration.test.ts src/infrastructure/restored-materials.integration.test.ts src/infrastructure/postgres-restore-import.integration.test.ts src/infrastructure/postgres-restore-resume.integration.test.ts
      - name: Frozen classroom captions, historical upgrade and narration guards on PostgreSQL
        working-directory: apps/api
        env:
          STUDY_TEST_CLASSROOM_PRESENTATION_POSTGRES_URL: postgresql://study_agent_app:local_ci_app_only@127.0.0.1:5432/study_agent_qa
        run: node --env-file=../../.env ../../node_modules/vitest/vitest.mjs run src/modules/learning/classroom-presentation.integration.test.ts
      - name: GESP assisted guidance and retention PostgreSQL journey
        env:
          STUDY_STORAGE: postgres
