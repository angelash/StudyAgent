<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">从系数比到质量比</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">从系数比到质量比</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><text x="440" y="140" font-size="43" fill="#2e4339" text-anchor="middle">2H₂ + O₂ → 2H₂O</text><text x="440" y="180" font-size="20" fill="#2e4339" text-anchor="middle">适用反应条件：点燃</text><rect x="50" y="230" width="225" height="115" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="68" y="265" font-size="25" fill="#2e4339" text-anchor="start">2×2 = 4</text><text x="68" y="300" font-size="18" fill="#2e4339" text-anchor="start">氢气的相对质量</text><rect x="327" y="230" width="225" height="115" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="345" y="265" font-size="25" fill="#2e4339" text-anchor="start">1×32 = 32</text><text x="345" y="300" font-size="18" fill="#2e4339" text-anchor="start">氧气的相对质量</text><rect x="604" y="230" width="225" height="115" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="622" y="265" font-size="25" fill="#2e4339" text-anchor="start">2×18 = 36</text><text x="622" y="300" font-size="18" fill="#2e4339" text-anchor="start">水的相对质量</text><text x="440" y="425" font-size="31" fill="#4f8064" text-anchor="middle">粒子数比2∶1∶2 → 质量比4∶32∶36</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
