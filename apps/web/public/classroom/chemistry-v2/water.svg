<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">水的组成：比较不同的比值</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">水的组成：比较不同的比值</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="70" y="140" width="300" height="220" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><rect x="510" y="140" width="300" height="220" rx="12" fill="#f6ecdc" stroke="#c6d3c3" /><path d="M152,220L188,220" fill="none" stroke="#829688" stroke-width="3" /><circle cx="152" cy="220" r="15" fill="#f4e3ae" stroke="#2e4339"/><text x="152" y="226" font-size="18" fill="#2e4339" text-anchor="middle">H</text><circle cx="188" cy="220" r="15" fill="#f4e3ae" stroke="#2e4339"/><text x="188" y="226" font-size="18" fill="#2e4339" text-anchor="middle">H</text><path d="M267,220L303,220" fill="none" stroke="#829688" stroke-width="3" /><circle cx="267" cy="220" r="15" fill="#f4e3ae" stroke="#2e4339"/><text x="267" y="226" font-size="18" fill="#2e4339" text-anchor="middle">H</text><circle cx="303" cy="220" r="15" fill="#f4e3ae" stroke="#2e4339"/><text x="303" y="226" font-size="18" fill="#2e4339" text-anchor="middle">H</text><path d="M642,220L678,220" fill="none" stroke="#829688" stroke-width="3" /><circle cx="642" cy="220" r="21" fill="#d56449" stroke="#2e4339"/><text x="642" y="226" font-size="18" fill="#fff" text-anchor="middle">O</text><circle cx="678" cy="220" r="21" fill="#d56449" stroke="#2e4339"/><text x="678" y="226" font-size="18" fill="#fff" text-anchor="middle">O</text><text x="220" y="115" font-size="28" fill="#2e4339" text-anchor="middle">阴极（−）：H₂</text><text x="660" y="115" font-size="28" fill="#2e4339" text-anchor="middle">阳极（+）：O₂</text><text x="220" y="315" font-size="26" fill="#2e4339" text-anchor="middle">体积约2份</text><text x="660" y="315" font-size="26" fill="#2e4339" text-anchor="middle">体积约1份</text><text x="440" y="415" font-size="31" fill="#4f8064" text-anchor="middle">体积比2∶1　≠　质量比1∶8</text><text x="440" y="455" font-size="22" fill="#2e4339" text-anchor="middle">同温同压；气体粒子数为示意。</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
