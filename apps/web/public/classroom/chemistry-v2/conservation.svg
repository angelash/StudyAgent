<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">质量守恒与系统边界</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">质量守恒与系统边界</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="40" y="145" width="340" height="230" rx="12" fill="#edf2e9" stroke="#c6d3c3" stroke-dasharray="8 5"/><path d="M210,245L255,245" fill="none" stroke="#829688" stroke-width="3" /><circle cx="210" cy="245" r="21" fill="#4a5860" stroke="#2e4339"/><text x="210" y="251" font-size="18" fill="#fff" text-anchor="middle">C</text><circle cx="255" cy="245" r="21" fill="#d56449" stroke="#2e4339"/><text x="255" y="251" font-size="18" fill="#fff" text-anchor="middle">O</text><path d="M210,245L165,245" fill="none" stroke="#829688" stroke-width="3" /><circle cx="165" cy="245" r="21" fill="#d56449" stroke="#2e4339"/><text x="165" y="251" font-size="18" fill="#fff" text-anchor="middle">O</text><text x="210" y="330" font-size="23" fill="#2e4339" text-anchor="middle">称量范围内的CO₂</text><path d="M400,250L485,250" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M476,243L485,250L476,257" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="510" y="145" width="330" height="230" rx="12" fill="#f6ecdc" stroke="#c6d3c3" /><path d="M675,245L720,245" fill="none" stroke="#829688" stroke-width="3" /><circle cx="675" cy="245" r="21" fill="#4a5860" stroke="#2e4339"/><text x="675" y="251" font-size="18" fill="#fff" text-anchor="middle">C</text><circle cx="720" cy="245" r="21" fill="#d56449" stroke="#2e4339"/><text x="720" y="251" font-size="18" fill="#fff" text-anchor="middle">O</text><path d="M675,245L630,245" fill="none" stroke="#829688" stroke-width="3" /><circle cx="630" cy="245" r="21" fill="#d56449" stroke="#2e4339"/><text x="630" y="251" font-size="18" fill="#fff" text-anchor="middle">O</text><text x="675" y="330" font-size="23" fill="#2e4339" text-anchor="middle">逸出范围的CO₂</text><text x="440" y="420" font-size="29" fill="#4f8064" text-anchor="middle">剩余质量 + 逸出质量 = 反应前总质量</text><text x="440" y="465" font-size="23" fill="#2e4339" text-anchor="middle">不能把逸出气体从生成物总质量中漏掉。</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
