<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">括号、下标与相对质量</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">括号、下标与相对质量</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><text x="440" y="160" font-size="65" fill="#2e4339" text-anchor="middle">Ca(OH)₂</text><path d="M340,185L220,250" fill="none" stroke="#829688" stroke-width="3" /><path d="M440,185L440,250" fill="none" stroke="#829688" stroke-width="3" /><path d="M540,185L660,250" fill="none" stroke="#829688" stroke-width="3" /><rect x="65" y="265" width="220" height="95" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="83" y="300" font-size="25" fill="#2e4339" text-anchor="start">1个Ca</text><text x="83" y="335" font-size="18" fill="#2e4339" text-anchor="start">1×40 = 40</text><rect x="330" y="265" width="220" height="95" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="348" y="300" font-size="25" fill="#2e4339" text-anchor="start">2个O</text><text x="348" y="335" font-size="18" fill="#2e4339" text-anchor="start">2×16 = 32</text><rect x="595" y="265" width="220" height="95" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="613" y="300" font-size="25" fill="#2e4339" text-anchor="start">2个H</text><text x="613" y="335" font-size="18" fill="#2e4339" text-anchor="start">2×1 = 2</text><text x="440" y="440" font-size="31" fill="#4f8064" text-anchor="middle">40 + 32 + 2 = 74（不带g单位）</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
