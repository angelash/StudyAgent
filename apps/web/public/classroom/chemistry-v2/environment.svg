<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">排放物与环境影响</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">排放物与环境影响</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="45" y="125" width="315" height="80" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="63" y="160" font-size="25" fill="#2e4339" text-anchor="start">CO₂</text><text x="63" y="195" font-size="18" fill="#2e4339" text-anchor="start">排放与温室效应增强有关</text><rect x="45" y="230" width="315" height="80" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="63" y="265" font-size="25" fill="#2e4339" text-anchor="start">CO</text><text x="63" y="300" font-size="18" fill="#2e4339" text-anchor="start">有毒；含碳燃料不完全燃烧可产生</text><rect x="45" y="335" width="315" height="80" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="63" y="370" font-size="25" fill="#2e4339" text-anchor="start">SO₂、颗粒物等</text><text x="63" y="405" font-size="18" fill="#2e4339" text-anchor="start">分别关注酸雨、空气质量等</text><path d="M385,165L475,165" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M466,158L475,165L466,172" fill="none" stroke="#4f8064" stroke-width="3"/><path d="M385,270L475,270" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M466,263L475,270L466,277" fill="none" stroke="#4f8064" stroke-width="3"/><path d="M385,375L475,375" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M466,368L475,375L466,382" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="500" y="125" width="335" height="80" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="518" y="160" font-size="25" fill="#2e4339" text-anchor="start">节能、低碳能源</text><text x="518" y="195" font-size="18" fill="#2e4339" text-anchor="start">核算各环节碳排放</text><rect x="500" y="230" width="335" height="80" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="518" y="265" font-size="25" fill="#2e4339" text-anchor="start">燃烧条件与通风</text><text x="518" y="300" font-size="18" fill="#2e4339" text-anchor="start">不以无气味证明安全</text><rect x="500" y="335" width="335" height="80" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="518" y="370" font-size="25" fill="#2e4339" text-anchor="start">净化与治理</text><text x="518" y="405" font-size="18" fill="#2e4339" text-anchor="start">按具体排放物选择措施</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
