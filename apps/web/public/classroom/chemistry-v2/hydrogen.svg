<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">氢能：反应与评估边界</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">氢能：反应与评估边界</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="45" y="155" width="230" height="130" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="63" y="190" font-size="25" fill="#2e4339" text-anchor="start">制氢</text><text x="63" y="225" font-size="18" fill="#2e4339" text-anchor="start">能源来源？</text><path d="M290,220L325,220" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M316,213L325,220L316,227" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="340" y="155" width="205" height="130" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="358" y="190" font-size="25" fill="#2e4339" text-anchor="start">储运</text><text x="358" y="225" font-size="18" fill="#2e4339" text-anchor="start">能耗与条件？</text><path d="M560,220L595,220" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M586,213L595,220L586,227" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="610" y="155" width="225" height="130" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="628" y="190" font-size="25" fill="#2e4339" text-anchor="start">使用</text><text x="628" y="225" font-size="18" fill="#2e4339" text-anchor="start">氢氧反应生成水</text><text x="440" y="370" font-size="30" fill="#2e4339" text-anchor="middle">2H₂ + O₂ → 2H₂O（适用条件下）</text><text x="440" y="430" font-size="30" fill="#4f8064" text-anchor="middle">一个环节生成水 ≠ 全流程必定零排放</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
