<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">元素分类看质子数</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">元素分类看质子数</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="55" y="145" width="340" height="195" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="73" y="180" font-size="25" fill="#2e4339" text-anchor="start">¹²C</text><text x="73" y="215" font-size="18" fill="#2e4339" text-anchor="start">6个质子 + 6个中子</text><rect x="485" y="145" width="340" height="195" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="503" y="180" font-size="25" fill="#2e4339" text-anchor="start">¹³C</text><text x="503" y="215" font-size="18" fill="#2e4339" text-anchor="start">6个质子 + 7个中子</text><circle cx="225" cy="280" r="32" fill="#4a5860" stroke="#2e4339"/><text x="225" y="286" font-size="18" fill="#fff" text-anchor="middle">C</text><circle cx="655" cy="280" r="32" fill="#4a5860" stroke="#2e4339"/><text x="655" y="286" font-size="18" fill="#fff" text-anchor="middle">C</text><text x="440" y="405" font-size="29" fill="#4f8064" text-anchor="middle">质子数相同 → 同属碳元素</text><text x="440" y="445" font-size="24" fill="#2e4339" text-anchor="middle">中子数不同，不改变元素种类。</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
