<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">性质与变化</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">性质与变化</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="45" y="140" width="335" height="120" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="63" y="175" font-size="25" fill="#2e4339" text-anchor="start">铜能导电</text><text x="63" y="210" font-size="18" fill="#2e4339" text-anchor="start">物理性质：不以生成新物质为前提</text><path d="M395,200L465,200" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M456,193L465,200L456,207" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="490" y="140" width="335" height="120" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="508" y="175" font-size="25" fill="#2e4339" text-anchor="start">一次通电过程</text><text x="508" y="210" font-size="18" fill="#2e4339" text-anchor="start">性质描述“能怎样”</text><rect x="45" y="300" width="335" height="120" rx="12" fill="#f5ebdb" stroke="#c6d3c3" /><text x="63" y="335" font-size="25" fill="#2e4339" text-anchor="start">酒精能燃烧</text><text x="63" y="370" font-size="18" fill="#2e4339" text-anchor="start">化学性质：需在化学变化中表现</text><path d="M395,360L465,360" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M456,353L465,360L456,367" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="490" y="300" width="335" height="120" rx="12" fill="#f5ebdb" stroke="#c6d3c3" /><text x="508" y="335" font-size="25" fill="#2e4339" text-anchor="start">酒精正在燃烧</text><text x="508" y="370" font-size="18" fill="#2e4339" text-anchor="start">变化描述“发生了什么”</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
