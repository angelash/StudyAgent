<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">化合价与组成比</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">化合价与组成比</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="50" y="150" width="345" height="165" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="68" y="185" font-size="25" fill="#2e4339" text-anchor="start">Al：+3价 × 2</text><text x="68" y="220" font-size="18" fill="#2e4339" text-anchor="start">总和 +6</text><rect x="485" y="150" width="345" height="165" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="503" y="185" font-size="25" fill="#2e4339" text-anchor="start">O：−2价 × 3</text><text x="503" y="220" font-size="18" fill="#2e4339" text-anchor="start">总和 −6</text><text x="440" y="255" font-size="35" fill="#2e4339" text-anchor="middle">+</text><text x="440" y="385" font-size="32" fill="#4f8064" text-anchor="middle">2×(+3) + 3×(−2) = 0</text><text x="440" y="445" font-size="32" fill="#2e4339" text-anchor="middle">最简组成比2∶3 → Al₂O₃</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
