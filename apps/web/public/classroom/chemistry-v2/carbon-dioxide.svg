<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">CO₂的性质与证据</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">CO₂的性质与证据</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="40" y="150" width="250" height="160" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="58" y="185" font-size="24.180790960451972" fill="#2e4339" text-anchor="start">干燥石蕊 + 干CO₂</text><text x="58" y="220" font-size="18" fill="#2e4339" text-anchor="start">通常不变红</text><rect x="315" y="150" width="250" height="160" rx="12" fill="#f3dfe1" stroke="#c6d3c3" /><text x="333" y="185" font-size="25" fill="#2e4339" text-anchor="start">湿润石蕊 + CO₂</text><text x="333" y="220" font-size="18" fill="#2e4339" text-anchor="start">可变红：水参与反应</text><rect x="590" y="150" width="250" height="160" rx="12" fill="#f3f0e4" stroke="#c6d3c3" /><text x="608" y="185" font-size="24.180790960451972" fill="#2e4339" text-anchor="start">澄清石灰水 + CO₂</text><text x="608" y="220" font-size="18" fill="#2e4339" text-anchor="start">少量CO₂：白色浑浊</text><text x="440" y="385" font-size="27" fill="#2e4339" text-anchor="middle">CO₂ + H₂O → H₂CO₃</text><text x="440" y="435" font-size="27" fill="#4f8064" text-anchor="middle">CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
