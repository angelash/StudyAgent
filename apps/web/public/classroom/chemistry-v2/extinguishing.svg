<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">灭火的原理</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">灭火的原理</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="45" y="155" width="245" height="185" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="63" y="190" font-size="25" fill="#2e4339" text-anchor="start">移走可燃物</text><text x="63" y="225" font-size="18" fill="#2e4339" text-anchor="start">切断可燃物条件</text><rect x="318" y="155" width="245" height="185" rx="12" fill="#f6ecdc" stroke="#c6d3c3" /><text x="336" y="190" font-size="25" fill="#2e4339" text-anchor="start">隔绝氧气</text><text x="336" y="225" font-size="18" fill="#2e4339" text-anchor="start">切断助燃条件</text><rect x="590" y="155" width="245" height="185" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="608" y="190" font-size="25" fill="#2e4339" text-anchor="start">降温</text><text x="608" y="225" font-size="18" fill="#2e4339" text-anchor="start">降到着火点以下</text><text x="440" y="420" font-size="29" fill="#4f8064" text-anchor="middle">冷却改变温度，不是降低物质的着火点。</text><text x="440" y="460" font-size="22" fill="#2e4339" text-anchor="middle">具体火情的处理方法不能由单一条件图直接决定。</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
