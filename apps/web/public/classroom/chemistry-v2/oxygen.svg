<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">助燃与可燃</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">助燃与可燃</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="45" y="125" width="340" height="270" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><path d="M192,200L228,200" fill="none" stroke="#829688" stroke-width="3" /><circle cx="192" cy="200" r="21" fill="#d56449" stroke="#2e4339"/><text x="192" y="206" font-size="18" fill="#fff" text-anchor="middle">O</text><circle cx="228" cy="200" r="21" fill="#d56449" stroke="#2e4339"/><text x="228" y="206" font-size="18" fill="#fff" text-anchor="middle">O</text><text x="210" y="285" font-size="29" fill="#2e4339" text-anchor="middle">氧气：助燃</text><text x="210" y="330" font-size="22" fill="#2e4339" text-anchor="middle">不能当作普通燃料</text><path d="M405,255L480,255" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M471,248L480,255L471,262" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="500" y="125" width="330" height="270" rx="12" fill="#f6ecda" stroke="#c6d3c3" /><path d="M580,330l135,-100" stroke="#9e7846" stroke-width="15"/><circle cx="715" cy="230" r="16" fill="#d4834b"/><text x="665" y="165" font-size="25" fill="#2e4339" text-anchor="middle">带火星的木条复燃</text><text x="665" y="375" font-size="23" fill="#2e4339" text-anchor="middle">可燃物是木条</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
