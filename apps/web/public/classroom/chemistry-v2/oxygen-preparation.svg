<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">制氧：发生、收集、检验</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">制氧：发生、收集、检验</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="40" y="150" width="240" height="150" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="58" y="185" font-size="25" fill="#2e4339" text-anchor="start">发生</text><text x="58" y="220" font-size="18" fill="#2e4339" text-anchor="start">H₂O₂溶液 + MnO₂</text><text x="60" y="270" font-size="22" fill="#4f8064" text-anchor="start">不另行加热</text><path d="M295,225L335,225" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M326,218L335,225L326,232" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="350" y="150" width="220" height="150" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="368" y="185" font-size="25" fill="#2e4339" text-anchor="start">收集</text><text x="368" y="220" font-size="18" fill="#2e4339" text-anchor="start">可用排水法</text><path d="M585,225L625,225" fill="none" stroke="#4f8064" stroke-width="3" /><path d="M616,218L625,225L616,232" fill="none" stroke="#4f8064" stroke-width="3"/><rect x="640" y="150" width="205" height="150" rx="12" fill="#edf2e9" stroke="#c6d3c3" /><text x="658" y="185" font-size="25" fill="#2e4339" text-anchor="start">检验</text><text x="658" y="220" font-size="18" fill="#2e4339" text-anchor="start">带火星木条复燃</text><text x="440" y="370" font-size="28" fill="#2e4339" text-anchor="middle">2H₂O₂ → 2H₂O + O₂↑（MnO₂催化）</text><text x="440" y="425" font-size="22" fill="#4f8064" text-anchor="middle">先依据条件选装置，再依据性质选收集方法。</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
