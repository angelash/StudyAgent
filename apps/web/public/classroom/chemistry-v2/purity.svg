<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">纯度与有效反应物</title><desc id="desc">原创教学示意图；颜色区分物质或元素，不按真实尺寸比例。相关条件与解释见本课正文。</desc><rect width="880" height="520" fill="#fffdf7"/><g font-family="system-ui, sans-serif" fill="#2e4339"><text x="40" y="55" font-size="30" fill="#2e4339" text-anchor="start">纯度与有效反应物</text><path d="M40,78L840,78" fill="none" stroke="#dce3d5" stroke-width="3" /><rect x="60" y="190" width="608" height="105" rx="5" fill="#4f8064"/><rect x="668" y="190" width="152" height="105" rx="5" fill="#d3c8b0"/><text x="365" y="250" font-size="30" fill="#fff" text-anchor="middle">有效成分：80 g</text><text x="745" y="250" font-size="27" fill="#2e4339" text-anchor="middle">20 g</text><text x="440" y="140" font-size="31" fill="#2e4339" text-anchor="middle">100 g样品，纯度80%</text><text x="700" y="335" font-size="20" fill="#2e4339" text-anchor="middle">不参与反应的杂质</text><text x="440" y="425" font-size="29" fill="#4f8064" text-anchor="middle">先换算纯物质质量，再代入反应比例。</text><text x="40" y="505" font-size="14" fill="#748472" text-anchor="start">StudyAgent · 原创化学图示 · 模型不代替真实实验</text></g></svg>
