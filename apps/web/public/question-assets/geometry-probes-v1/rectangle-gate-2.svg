<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc"><title id="title">留一个门的长方形菜地</title><desc id="desc">长10米、宽5米，下边留3米的门，其余四边围栏。内部虚线小路不属于边界。</desc><rect width="420" height="300" rx="14" fill="#f7f3e9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><g data-geometry="rectangle-gate" data-unit="m" data-scale="28"><rect x="70" y="55" width="280" height="140" fill="#e6ede2"/><line x1="70" y1="55" x2="350" y2="55" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="70" y1="55" x2="70" y2="195" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="350" y1="55" x2="350" y2="195" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="70" y1="195" x2="126" y2="195" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="210" y1="195" x2="350" y2="195" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="126" y1="195" x2="210" y2="195" stroke="#b56a32" stroke-width="3" stroke-dasharray="3 5" data-role="gate"/><line x1="98" y1="125" x2="322" y2="125" stroke="#667c72" stroke-width="2" stroke-dasharray="7 5" data-role="interior-path"/><text x="210" y="41" font-size="15" text-anchor="middle" fill="#275345" >长 10 米</text><text x="372" y="130" font-size="14" text-anchor="middle" fill="#275345" >5米</text><text x="168" y="221" font-size="14" text-anchor="middle" fill="#275345" >门 3 米</text><text x="210" y="115" font-size="13" text-anchor="middle" fill="#275345" >内部小路</text><text x="210" y="278" font-size="13" text-anchor="middle" fill="#275345" >实线是围栏 · 虚线标出门和内部小路</text></g></g></svg>
