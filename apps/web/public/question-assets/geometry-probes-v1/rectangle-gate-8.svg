<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc"><title id="title">留一个门的长方形菜地</title><desc id="desc">长16米、宽3米，下边留3米的门，其余四边围栏。内部虚线小路不属于边界。</desc><rect width="420" height="300" rx="14" fill="#f7f3e9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><g data-geometry="rectangle-gate" data-unit="m" data-scale="18.125"><rect x="65" y="97.8125" width="290" height="54.375" fill="#e6ede2"/><line x1="65" y1="97.8125" x2="355" y2="97.8125" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="65" y1="97.8125" x2="65" y2="152.1875" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="355" y1="97.8125" x2="355" y2="152.1875" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="65" y1="152.1875" x2="101.25" y2="152.1875" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="155.625" y1="152.1875" x2="355" y2="152.1875" stroke="#275345" stroke-width="4" stroke-linecap="round" data-role="fence"/><line x1="101.25" y1="152.1875" x2="155.625" y2="152.1875" stroke="#b56a32" stroke-width="3" stroke-dasharray="3 5" data-role="gate"/><line x1="83.125" y1="125" x2="336.875" y2="125" stroke="#667c72" stroke-width="2" stroke-dasharray="7 5" data-role="interior-path"/><text x="210" y="83.8125" font-size="15" text-anchor="middle" fill="#275345" >长 16 米</text><text x="377" y="130" font-size="14" text-anchor="middle" fill="#275345" >3米</text><text x="128.4375" y="178.1875" font-size="14" text-anchor="middle" fill="#275345" >门 3 米</text><text x="210" y="115" font-size="13" text-anchor="middle" fill="#275345" >内部小路</text><text x="210" y="278" font-size="13" text-anchor="middle" fill="#275345" >实线是围栏 · 虚线标出门和内部小路</text></g></g></svg>
