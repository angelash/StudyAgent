<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc"><title id="title">等角条件下恢复三角形内角</title><desc id="desc">三角形ABC，已明确给出角A等于角B，角A为60度。图形按真实角度绘制。</desc><rect width="480" height="340" rx="14" fill="#f7f3e9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="240" y="31" font-size="17" text-anchor="middle" fill="#275345" >已知：∠A = ∠B</text><polygon data-role="triangle" points="136.076952,251 343.923048,251 240,71" fill="#e3eee9" stroke="#176b8a" stroke-width="3" stroke-linejoin="round"/><text x="118.076952" y="274" font-size="16" text-anchor="middle" fill="#275345" >A</text><text x="361.923048" y="274" font-size="16" text-anchor="middle" fill="#275345" >B</text><text x="240" y="59" font-size="16" text-anchor="middle" fill="#275345" >C</text><text x="240" y="315" font-size="17" text-anchor="middle" fill="#275345" >∠A = 60°；其余内角待核对</text></g></svg>
