<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc"><title id="title">平角相邻与三角形内角</title><desc id="desc">三角形ABC，边BA经过A向左延长至D；D、A、B共线且A位于D和B之间。角DAC为110度，角ABC为30度。</desc><rect width="480" height="340" rx="14" fill="#f7f3e9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="240" y="30" font-size="17" text-anchor="middle" fill="#275345" >相邻开口组成平角</text><polygon data-role="triangle" points="85,251 395,251 138.830935,103.100721" fill="#e3eee9" stroke="#176b8a" stroke-width="3" stroke-linejoin="round"/><line x1="30" y1="251" x2="85" y2="251" data-role="extension" stroke="#b56a32" stroke-width="3" stroke-dasharray="6 4"/><text x="67" y="274" font-size="16" text-anchor="middle" fill="#275345" >A</text><text x="413" y="274" font-size="16" text-anchor="middle" fill="#275345" >B</text><text x="138.830935" y="91.100721" font-size="16" text-anchor="middle" fill="#275345" >C</text><text x="21" y="273" font-size="16" text-anchor="middle" fill="#275345" >D</text><text x="240" y="314" font-size="17" text-anchor="middle" fill="#275345" >∠DAC = 110°；∠ABC = 30°</text></g></svg>
