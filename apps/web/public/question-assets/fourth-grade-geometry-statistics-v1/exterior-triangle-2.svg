<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc"><title id="title">平角相邻与三角形内角</title><desc id="desc">三角形ABC，边BA经过A向左延长至D；D、A、B共线且A位于D和B之间。角DAC为130度，角ABC为50度。</desc><rect width="480" height="340" rx="14" fill="#f7f3e9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="240" y="30" font-size="17" text-anchor="middle" fill="#275345" >相邻开口组成平角</text><polygon data-role="triangle" points="88.962066,251 391.037934,251 240,71" fill="#e3eee9" stroke="#176b8a" stroke-width="3" stroke-linejoin="round"/><line x1="33.962066" y1="251" x2="88.962066" y2="251" data-role="extension" stroke="#b56a32" stroke-width="3" stroke-dasharray="6 4"/><text x="70.962066" y="274" font-size="16" text-anchor="middle" fill="#275345" >A</text><text x="409.037934" y="274" font-size="16" text-anchor="middle" fill="#275345" >B</text><text x="240" y="59" font-size="16" text-anchor="middle" fill="#275345" >C</text><text x="24.962066" y="273" font-size="16" text-anchor="middle" fill="#275345" >D</text><text x="240" y="314" font-size="17" text-anchor="middle" fill="#275345" >∠DAC = 130°；∠ABC = 50°</text></g></svg>
