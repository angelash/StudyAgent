<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc"><title id="title">比较开口与直角</title><desc id="desc">左边蓝色角按真实比例绘制；右边为带直角标记的参照。两边长度和整体方向不决定角的类别。</desc><rect width="480" height="340" rx="14" fill="#f7f3e9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="240" y="32" font-size="17" text-anchor="middle" fill="#275345" >比较角的开口</text><line x1="155" y1="166" x2="63.056044" y2="169.210754" data-role="angle-ray" stroke="#176b8a" stroke-width="4" stroke-linecap="round"/><line x1="155" y1="166" x2="216.806332" y2="198.863009" data-role="angle-ray" stroke="#176b8a" stroke-width="4" stroke-linecap="round"/><path d="M130.015229,166.872487 A25,25 0 0 0 177.07369,177.736789" fill="none" stroke="#176b8a" stroke-width="2"/><text x="160.173874" y="148.589489" font-size="15" text-anchor="middle" fill="#275345" >O</text><line x1="355" y1="192" x2="426" y2="192" data-role="reference-ray" stroke="#b56a32" stroke-width="3"/><line x1="355" y1="192" x2="355" y2="121" data-role="reference-ray" stroke="#b56a32" stroke-width="3"/><path d="M355,174 L373,174 L373,192" fill="none" stroke="#b56a32" stroke-width="2"/><text x="390" y="231" font-size="16" text-anchor="middle" fill="#275345" >直角参照</text><text x="240" y="312" font-size="16" text-anchor="middle" fill="#275345" >只比较开口，不比较边长与方向</text></g></svg>
