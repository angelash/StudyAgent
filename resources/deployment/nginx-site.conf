# Include in the nginx http context. Substitute the domain and certificate paths.
# API/Web listen only on loopback. Both cookies and requests use this HTTPS origin.
server {
    listen 80;
    server_name study.example.com;
    return 308 https://study.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name study.example.com;
    ssl_certificate /etc/letsencrypt/live/study.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Admin import chunks are 4 MiB; student media chunks are 1 MiB.
    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace, never append, client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 65s;
    }
}
